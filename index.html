<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشماع | أثاث عصري فاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Design Variables: Luxury Theme */
        :root { --primary: #1a2a3a; --accent: #cda45e; --bg-light: #f8f9fa; --text-dark: #333; --white: #ffffff; --shadow: 0 10px 30px rgba(0, 0, 0, 0.08); --transition: all 0.3s ease; }
        /* Chat Variables: WhatsApp Theme */
        :root { --wa-green: #25d366; --wa-header: #075e54; --wa-bg: #e5ddd5; --wa-me: #dcf8c6; --wa-other: #ffffff; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; padding-bottom: 80px; }

        /* Navbar & Header (Luxury) */
        .navbar { background-color: var(--white); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; height: 70px; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); cursor: pointer; }
        .logo i { color: var(--accent); margin-left: 5px; }
        .nav-links { list-style: none; display: flex; gap: 30px; }
        .nav-links a { color: var(--text-dark); text-decoration: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }
        .badge { background: var(--accent); color: white; padding: 2px 6px; border-radius: 50%; font-size: 0.7rem; vertical-align: top; }

        .hero-section { height: 60vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000') no-repeat center center/cover; display: flex; align-items: center; justify-content: center; text-align: center; color: white; }
        .cta-btn { padding: 12px 35px; background: var(--accent); color: white; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .cta-btn:hover { background: #b88e46; transform: translateY(-3px); }

        /* Categories Tabs */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .categories-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .categories-tabs span { padding: 10px 25px; border: 2px solid #ddd; border-radius: 25px; cursor: pointer; background: white; transition: 0.3s; font-weight: bold; }
        .categories-tabs span.active-cat { background: var(--primary); color: white; border-color: var(--primary); }
        .sub-categories-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .sub-categories-tabs span { padding: 6px 15px; background: #eee; border-radius: 15px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .sub-categories-tabs span.active-sub { background: var(--accent); color: white; }

        /* Products Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: var(--white); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); cursor: pointer; position: relative; }
        .product-card:hover { transform: translateY(-10px); }
        .img-container { height: 250px; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; }
        .discount-badge { position: absolute; top: 15px; right: 15px; background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }
        .p-info { padding: 20px; }
        .current-price { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .old-price { text-decoration: line-through; color: #999; margin-right: 10px; font-size: 0.9rem; }

        /* Chat Widget (WhatsApp Style) */
        .wa-float-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: var(--wa-green); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 3000; cursor: pointer; transition: 0.3s; }
        .wa-float-btn:hover { transform: scale(1.1); }

        #chatModal { display: none; position: fixed; bottom: 90px; right: 20px; width: 350px; height: 500px; background: var(--wa-bg); border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 3001; flex-direction: column; overflow: hidden; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .chat-header { background: var(--wa-header); color: white; padding: 15px; display: flex; align-items: center; gap: 10px; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; background: white; }
        #chatMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 7px; max-width: 80%; font-size: 0.9rem; position: relative; line-height: 1.4; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .msg-me { align-self: flex-end; background: var(--wa-me); border-top-left-radius: 0; }
        .msg-other { align-self: flex-start; background: var(--wa-other); border-top-right-radius: 0; }
        .chat-input { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; align-items: center; }
        .chat-input input { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
        .chat-input button { background: var(--wa-header); color: white; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Cart Sidebar & Modals */
        .cart-sidebar { position: fixed; top: 0; left: -400px; width: 350px; height: 100%; background: white; z-index: 2500; box-shadow: 5px 0 20px rgba(0,0,0,0.1); transition: 0.4s; display: flex; flex-direction: column; }
        .cart-sidebar.open { left: 0; }
        
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 5% auto; width: 95%; max-width: 600px; border-radius: 20px; overflow: hidden; padding: 30px; position: relative; animation: zoomIn 0.3s; }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Mobile Responsive */
        @media(max-width:768px) { .hero-section { height: 50vh; } .hero-content h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="location.reload()"><i class="fa-solid fa-couch"></i> الشماع</div>
        <ul class="nav-links">
            <li><a onclick="document.getElementById('homeSection').scrollIntoView()">الرئيسية</a></li>
            <li><a onclick="toggleCart()">السلة <span id="cartCount" class="badge">0</span></a></li>
            <li><a onclick="openProfile()">حسابي</a></li>
        </ul>
    </nav>

    <!-- Chat Button -->
    <div class="wa-float-btn" onclick="toggleChat()"><i class="fa-brands fa-whatsapp"></i></div>

    <!-- Chat Modal -->
    <div id="chatModal">
        <div class="chat-header">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Admin">
            <div>
                <div style="font-weight:bold;">خدمة العملاء</div>
                <div style="font-size:0.75rem;">متصل الآن</div>
            </div>
            <i class="fa-solid fa-xmark" style="margin-right:auto; cursor:pointer;" onclick="toggleChat()"></i>
        </div>
        <div id="chatMessages">
            <p style="text-align:center; color:#555; font-size:0.8rem; margin-top:20px;">ابدأ المحادثة معنا</p>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="اكتب رسالة...">
            <button onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <header class="hero-section">
        <div class="hero-content">
            <h1>فخامة منزلك تبدأ من هنا</h1>
            <p style="margin-bottom:20px;">أحدث صيحات الأثاث العصري والكلاسيكي</p>
            <button class="cta-btn" onclick="document.getElementById('homeSection').scrollIntoView()">تسوق الآن</button>
        </div>
    </header>

    <div class="container">
        <section id="homeSection">
            <div style="text-align:center; margin-bottom:40px;">
                <h2>تشكيلة المعرض</h2>
                <div style="width:60px; height:3px; background:var(--accent); margin:10px auto;"></div>
            </div>
            
            <!-- Filters -->
            <div id="mainCategoriesTabs" class="categories-tabs"></div>
            <div id="subCategoriesTabs" class="sub-categories-tabs"></div>

            <!-- Products -->
            <div class="products-grid" id="productsContainer">
                <!-- Products loaded via JS -->
            </div>
        </section>
    </div>

    <!-- Product Details Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span onclick="document.getElementById('productModal').style.display='none'" style="position:absolute; left:20px; top:20px; cursor:pointer; font-size:1.5rem;"><i class="fa-solid fa-xmark"></i></span>
            <div style="text-align:center;">
                <img id="mImg" src="" style="width:100%; height:250px; object-fit:cover; border-radius:10px; margin-bottom:15px;">
                <h2 id="mTitle" style="color:var(--primary); margin-bottom:10px;"></h2>
                <p id="mDesc" style="color:#666; line-height:1.6; margin-bottom:15px;"></p>
                <div style="margin-bottom:20px;">
                    <span id="mPrice" class="current-price"></span> 
                    <span id="mOldPrice" class="old-price"></span>
                </div>
                <button class="cta-btn" style="width:100%;" onclick="addToCart()">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <!-- Profile Modal (Orders) -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span onclick="document.getElementById('profileModal').style.display='none'" style="position:absolute; left:20px; top:20px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></span>
            <h3 style="color:var(--primary); border-bottom:2px solid var(--accent); display:inline-block; padding-bottom:5px;">سجل طلباتي</h3>
            <div id="myOrdersList" style="margin-top:20px; max-height:400px; overflow-y:auto;"></div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div style="padding:20px; background:var(--primary); color:white; display:flex; justify-content:space-between; align-items:center;">
            <h3>سلة المشتريات</h3>
            <i class="fa-solid fa-xmark" onclick="toggleCart()" style="cursor:pointer"></i>
        </div>
        <div id="cartItems" style="flex:1; padding:20px; overflow-y:auto;"></div>
        <div style="padding:20px; border-top:1px solid #eee; background:#f9f9f9;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">
                <span>المجموع:</span><span id="totalPrice" style="color:var(--accent)">0 ج.م</span>
            </div>
            <button class="cta-btn" style="width:100%;" onclick="checkout()">تأكيد الطلب</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCE7wo3Vwzap7MnP4rv9kFZNwKlFD1myMM", authDomain: "furniture-416b8.firebaseapp.com", projectId: "furniture-416b8", storageBucket: "furniture-416b8.firebasestorage.app", messagingSenderId: "827913239758", appId: "1:827913239758:web:2fef185ebcf07d80e5e49f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Variables
        let productsData = [];
        let categoriesData = [];
        let currentMainCat = 'all';
        let currentSubCat = 'all';
        let currentProduct = null;
        
        // Identity (Phone)
        let userPhone = localStorage.getItem('shamma_phone');
        if(!userPhone) {
            userPhone = 'User_' + Math.floor(Math.random() * 100000);
            localStorage.setItem('shamma_phone', userPhone);
        }

        // ================= REAL-TIME LISTENERS =================
        
        // 1. استماع للمنتجات (تحديث فوري بدون ريفريش)
        onSnapshot(collection(db, "products"), (snapshot) => {
            productsData = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
            renderProducts(); // إعادة رسم المنتجات فوراً عند أي تغيير
        });

        // 2. استماع للأقسام
        onSnapshot(collection(db, "categories"), (snapshot) => {
            categoriesData = snapshot.docs.map(doc => doc.data());
            renderCategories();
        });

        // 3. استماع للشات (واتساب ستايل)
        const chatQ = query(collection(db, "chats"), where("chatId", "==", userPhone));
        onSnapshot(chatQ, (snapshot) => {
            const chatBox = document.getElementById('chatMessages');
            let msgs = [];
            snapshot.forEach(doc => msgs.push(doc.data()));
            msgs.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
            
            chatBox.innerHTML = '';
            msgs.forEach(m => {
                const cls = m.sender === 'customer' ? 'msg-me' : 'msg-other';
                chatBox.innerHTML += `<div class="msg ${cls}">${m.text}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // ================= RENDERING LOGIC =================

        function renderCategories() {
            const t = document.getElementById('mainCategoriesTabs');
            t.innerHTML = `<span class="${currentMainCat==='all'?'active-cat':''}" onclick="setMainCat('all')">الكل</span>`;
            categoriesData.forEach(c => {
                t.innerHTML += `<span class="${currentMainCat===c.name?'active-cat':''}" onclick="setMainCat('${c.name}')">${c.name}</span>`;
            });
        }

        window.setMainCat = (name) => {
            currentMainCat = name;
            currentSubCat = 'all'; // Reset sub
            renderCategories();
            
            // Render Sub Cats based on selection
            const s = document.getElementById('subCategoriesTabs');
            s.innerHTML = '';
            if(name !== 'all') {
                const catObj = categoriesData.find(c => c.name === name);
                if(catObj && catObj.subs) {
                    s.innerHTML = `<span class="active-sub" onclick="setSubCat('all', this)">الكل</span>`;
                    catObj.subs.forEach(sub => {
                        s.innerHTML += `<span onclick="setSubCat('${sub}', this)">${sub}</span>`;
                    });
                }
            }
            renderProducts();
        }

        window.setSubCat = (name, el) => {
            currentSubCat = name;
            document.querySelectorAll('#subCategoriesTabs span').forEach(e => e.classList.remove('active-sub'));
            el.classList.add('active-sub');
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            
            let filtered = productsData;
            if(currentMainCat !== 'all') filtered = filtered.filter(p => p.category === currentMainCat);
            if(currentSubCat !== 'all') filtered = filtered.filter(p => p.subCategory === currentSubCat);

            if(filtered.length === 0) {
                container.innerHTML = '<p style="grid-column:1/-1; text-align:center;">لا توجد منتجات متاحة حالياً</p>';
                return;
            }

            filtered.forEach(p => {
                const finalPrice = p.discount ? p.price - (p.price * p.discount / 100) : p.price;
                const pStr = encodeURIComponent(JSON.stringify(p));
                container.innerHTML += `
                    <div class="product-card" onclick="openProduct('${pStr}')">
                        <div class="img-container">
                            ${p.discount > 0 ? `<span class="discount-badge">خصم ${p.discount}%</span>` : ''}
                            <img src="${p.img}">
                        </div>
                        <div class="p-info">
                            <h3>${p.name}</h3>
                            <div>
                                <span class="current-price">${Math.floor(finalPrice)} ج.م</span>
                                ${p.discount > 0 ? `<span class="old-price">${p.price}</span>` : ''}
                            </div>
                        </div>
                    </div>`;
            });
        }

        // ================= INTERACTION LOGIC =================

        window.openProduct = (str) => {
            const p = JSON.parse(decodeURIComponent(str));
            currentProduct = p;
            document.getElementById('mImg').src = p.img;
            document.getElementById('mTitle').innerText = p.name;
            document.getElementById('mDesc').innerText = p.desc;
            const fp = p.discount ? p.price - (p.price * p.discount / 100) : p.price;
            document.getElementById('mPrice').innerText = Math.floor(fp) + " ج.م";
            document.getElementById('mOldPrice').innerText = p.discount ? p.price : "";
            document.getElementById('productModal').style.display = 'block';
        }

        window.addToCart = () => {
            let cart = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            cart.push({
                name: currentProduct.name,
                price: document.getElementById('mPrice').innerText,
                img: currentProduct.img
            });
            localStorage.setItem('shamma_cart', JSON.stringify(cart));
            document.getElementById('productModal').style.display = 'none';
            updateCart();
            window.toggleCart();
        }

        window.updateCart = () => {
            const cart = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
            const list = document.getElementById('cartItems');
            list.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                let priceNum = parseFloat(item.price.replace(/[^0-9.]/g, ''));
                total += priceNum;
                list.innerHTML += `
                    <div style="display:flex; gap:10px; margin-bottom:15px; align-items:center;">
                        <img src="${item.img}" style="width:50px; height:50px; object-fit:cover; border-radius:5px;">
                        <div style="flex:1;">
                            <b>${item.name}</b><br>
                            <span style="color:var(--accent)">${item.price}</span>
                        </div>
                        <i class="fa-solid fa-trash" style="color:#e74c3c; cursor:pointer;" onclick="remItem(${index})"></i>
                    </div>`;
            });
            document.getElementById('totalPrice').innerText = Math.floor(total) + " ج.م";
        }

        window.remItem = (index) => {
            let cart = JSON.parse(localStorage.getItem('shamma_cart'));
            cart.splice(index, 1);
            localStorage.setItem('shamma_cart', JSON.stringify(cart));
            updateCart();
        }

        window.toggleCart = () => {
            const s = document.getElementById('cartSidebar');
            s.classList.toggle('open');
        }

        window.checkout = async () => {
            const cart = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            if(cart.length === 0) return alert('السلة فارغة');
            
            const name = prompt("الاسم بالكامل:");
            if(!name) return;
            const phone = prompt("رقم الهاتف:");
            if(!phone) return;
            const address = prompt("العنوان:");

            // Save phone for chat
            localStorage.setItem('shamma_phone', phone);

            await addDoc(collection(db, "orders"), {
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                items: cart,
                totalPrice: document.getElementById('totalPrice').innerText,
                date: Date.now(),
                status: 'قيد المراجعة'
            });

            localStorage.removeItem('shamma_cart');
            updateCart();
            window.toggleCart();
            alert("تم إرسال الطلب بنجاح! سنتواصل معك قريباً.");
        }

        // Chat
        window.toggleChat = () => {
            const m = document.getElementById('chatModal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        window.sendChat = async () => {
            const inp = document.getElementById('chatInput');
            if(!inp.value.trim()) return;
            const txt = inp.value;
            inp.value = '';
            await addDoc(collection(db, "chats"), {
                chatId: userPhone,
                text: txt,
                sender: 'customer',
                timestamp: serverTimestamp(),
                customerName: localStorage.getItem('shamma_name') || 'عميل'
            });
        }

        // Profile
        window.openProfile = async () => {
            const p = localStorage.getItem('shamma_phone');
            const list = document.getElementById('myOrdersList');
            list.innerHTML = '<p style="text-align:center;">جاري التحميل...</p>';
            document.getElementById('profileModal').style.display = 'block';

            if(!p || p.startsWith('User_')) {
                list.innerHTML = '<p style="text-align:center; padding:10px;">قم بإجراء طلب أولاً لتتمكن من متابعة طلباتك</p>';
                return;
            }

            const q = query(collection(db, "orders"), where("customerPhone", "==", p));
            const snap = await getDocs(q);
            list.innerHTML = '';
            if(snap.empty) {
                list.innerHTML = '<p style="text-align:center;">لا توجد طلبات سابقة</p>';
                return;
            }
            snap.forEach(d => {
                const o = d.data();
                list.innerHTML += `
                    <div style="background:#f4f4f4; padding:10px; margin-bottom:10px; border-radius:8px; border-right:4px solid var(--accent);">
                        <div style="display:flex; justify-content:space-between; font-weight:bold;">
                            <span>${new Date(o.date).toLocaleDateString()}</span>
                            <span>${o.totalPrice}</span>
                        </div>
                        <div style="color:#666; font-size:0.9rem;">${o.items.length} منتجات</div>
                        <div style="color:var(--primary); font-weight:bold; margin-top:5px;">الحالة: ${o.status}</div>
                    </div>`;
            });
        }

        // Init
        updateCart();
    </script>
</body>
</html>
