<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشماع | أثاث عصري فاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #128C7E; --dark: #075E54; --bg-chat: #e5ddd5; --user-bubble: #dcf8c6; --admin-bubble: #ffffff; --text: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #f0f2f5; color: var(--text); padding-bottom: 80px; }

        /* Navbar */
        .navbar { background: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: bold; color: var(--dark); }
        .badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 50%; font-size: 0.8rem; }

        /* Products Grid */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; white-space: nowrap; }
        .cat-btn { padding: 8px 20px; background: white; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .cat-btn.active { background: var(--dark); color: white; border-color: var(--dark); }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        @media(min-width: 768px) { .products-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; } }
        
        .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.3s; cursor: pointer; }
        .product-card:hover { transform: translateY(-5px); }
        .p-img { height: 180px; width: 100%; object-fit: cover; }
        .p-info { padding: 15px; }
        .p-price { color: var(--dark); font-weight: bold; font-size: 1.1rem; }
        
        /* WhatsApp Style Chat Modal */
        #chatModal { display: none; position: fixed; bottom: 80px; right: 20px; width: 350px; height: 500px; background: var(--bg-chat); border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); z-index: 3000; flex-direction: column; overflow: hidden; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .chat-header { background: var(--dark); color: white; padding: 15px; display: flex; align-items: center; gap: 10px; }
        .chat-header img { width: 35px; height: 35px; border-radius: 50%; background: white; }
        #chatMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { padding: 8px 12px; border-radius: 7px; max-width: 75%; font-size: 0.9rem; position: relative; line-height: 1.4; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: var(--user-bubble); border-top-left-radius: 7px; }
        .msg-other { align-self: flex-start; background: var(--admin-bubble); border-top-right-radius: 7px; }
        .msg-time { font-size: 0.65rem; color: #999; text-align: left; margin-top: 4px; display: block; }

        .chat-input { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; }
        .chat-input input { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
        .chat-input button { background: var(--dark); color: white; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Floating Button */
        .float-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #25D366; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 2999; transition: 0.3s; }
        .float-btn:hover { transform: scale(1.1); }

        /* Product Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 4000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 15px; padding: 20px; position: relative; animation: popUp 0.3s; }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        /* Cart Sidebar */
        .cart-sidebar { position: fixed; top: 0; left: -100%; width: 300px; height: 100%; background: white; z-index: 5000; transition: 0.3s; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .cart-sidebar.active { left: 0; }

        .btn-main { background: var(--dark); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">الشماع <i class="fa-solid fa-couch"></i></div>
        <div style="cursor: pointer;" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i> <span id="cartCount" class="badge">0</span>
        </div>
    </nav>

    <div class="container">
        <div class="categories-scroll" id="catFilters">
            <button class="cat-btn active" onclick="filterProds('all', this)">الكل</button>
            <!-- Categories injected here -->
        </div>
        <div class="products-grid" id="productsContainer">
            <!-- Products injected real-time -->
        </div>
    </div>

    <!-- Floating Chat Button -->
    <div class="float-btn" onclick="toggleChat()"><i class="fa-brands fa-whatsapp"></i></div>

    <!-- Chat Window -->
    <div id="chatModal">
        <div class="chat-header">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Admin">
            <div>
                <div style="font-weight:bold; font-size:0.95rem;">خدمة العملاء</div>
                <div style="font-size:0.75rem; opacity:0.9;">متصل الآن</div>
            </div>
            <i class="fa-solid fa-xmark" style="margin-right:auto; cursor:pointer;" onclick="toggleChat()"></i>
        </div>
        <div id="chatMessages">
            <div style="text-align:center; padding:20px; background:#fff; border-radius:10px; margin:20px; font-size:0.85rem; opacity:0.8;">
                مرحباً بك في معرض الشماع! <br> كيف يمكننا مساعدتك اليوم؟
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="msgInput" placeholder="اكتب رسالتك...">
            <button onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="position:absolute; left:15px; top:15px; cursor:pointer; font-size:1.2rem;"><i class="fa-solid fa-xmark"></i></span>
            <img id="mImg" src="" style="width:100%; height:250px; object-fit:cover; border-radius:10px;">
            <h2 id="mName" style="margin:15px 0 5px;"></h2>
            <p id="mDesc" style="color:#666; font-size:0.9rem; line-height:1.6;"></p>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
                <span id="mPrice" style="font-size:1.4rem; font-weight:bold; color:var(--dark);"></span>
                <button class="btn-main" style="width:auto; padding:10px 25px;" onclick="addToCart()">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="cart-sidebar">
        <div style="background:var(--dark); color:white; padding:20px; display:flex; justify-content:space-between;">
            <h3>السلة</h3>
            <i class="fa-solid fa-xmark" onclick="toggleCart()" style="cursor:pointer;"></i>
        </div>
        <div id="cartItems" style="flex:1; overflow-y:auto; padding:15px;"></div>
        <div style="padding:15px; border-top:1px solid #eee;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold;">
                <span>الإجمالي:</span> <span id="cartTotal">0 ج.م</span>
            </div>
            <button class="btn-main" onclick="checkout()">إتمام الطلب</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCE7wo3Vwzap7MnP4rv9kFZNwKlFD1myMM", authDomain: "furniture-416b8.firebaseapp.com", projectId: "furniture-416b8", storageBucket: "furniture-416b8.firebasestorage.app", messagingSenderId: "827913239758", appId: "1:827913239758:web:2fef185ebcf07d80e5e49f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let currentProduct = null;
        let userPhone = localStorage.getItem('shamma_user_phone');
        
        // تسجيل رقم عشوائي للعميل إذا لم يوجد (للمحادثة)
        if(!userPhone) {
            userPhone = 'Guest_' + Math.floor(Math.random() * 100000);
            localStorage.setItem('shamma_user_phone', userPhone);
        }

        // 1. الاستماع للمنتجات (Real-time)
        // استخدام onSnapshot يضمن التحديث الفوري عند أي تغيير من البائع
        onSnapshot(collection(db, "products"), (snapshot) => {
            allProducts = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
            renderCategories();
            renderProducts('all');
        });

        // 2. الاستماع للرسائل (Real-time Chat)
        const qChat = query(collection(db, "chats"), where("chatId", "==", userPhone));
        onSnapshot(qChat, (snapshot) => {
            const chatBox = document.getElementById('chatMessages');
            // نحتفظ بالرسائل القديمة ونضيف الجديدة فقط أو نعيد الرسم (الأسهل إعادة الرسم مع الترتيب)
            let msgs = [];
            snapshot.forEach(doc => msgs.push(doc.data()));
            msgs.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
            
            chatBox.innerHTML = '';
            msgs.forEach(m => {
                const isMe = m.sender === 'customer';
                const time = m.timestamp ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';
                chatBox.innerHTML += `
                    <div class="msg ${isMe ? 'msg-me' : 'msg-other'}">
                        ${m.text}
                        <span class="msg-time">${time}</span>
                    </div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // دوال العرض
        function renderCategories() {
            const cats = [...new Set(allProducts.map(p => p.category))];
            const container = document.getElementById('catFilters');
            container.innerHTML = '<button class="cat-btn active" onclick="window.filterProds(\'all\', this)">الكل</button>';
            cats.forEach(c => {
                container.innerHTML += `<button class="cat-btn" onclick="window.filterProds('${c}', this)">${c}</button>`;
            });
        }

        window.filterProds = (cat, btn) => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat);
        }

        function renderProducts(cat) {
            const grid = document.getElementById('productsContainer');
            grid.innerHTML = '';
            const filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat);
            
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card" onclick="window.openProd('${encodeURIComponent(JSON.stringify(p))}')">
                        <img src="${p.img}" class="p-img">
                        <div class="p-info">
                            <h3 style="font-size:0.95rem; margin-bottom:5px;">${p.name}</h3>
                            <div class="p-price">${p.price} ج.م</div>
                        </div>
                    </div>`;
            });
        }

        // وظائف الشات
        window.toggleChat = () => {
            const m = document.getElementById('chatModal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        window.sendMsg = async () => {
            const inp = document.getElementById('msgInput');
            const txt = inp.value.trim();
            if(!txt) return;
            inp.value = '';
            await addDoc(collection(db, "chats"), {
                chatId: userPhone,
                text: txt,
                sender: 'customer',
                timestamp: serverTimestamp(),
                customerName: localStorage.getItem('shamma_cust_name') || 'عميل زائر'
            });
        }

        // وظائف السلة والمنتج
        window.openProd = (str) => {
            currentProduct = JSON.parse(decodeURIComponent(str));
            document.getElementById('mImg').src = currentProduct.img;
            document.getElementById('mName').innerText = currentProduct.name;
            document.getElementById('mDesc').innerText = currentProduct.desc;
            document.getElementById('mPrice').innerText = currentProduct.price + " ج.م";
            document.getElementById('productModal').style.display = 'flex';
        }
        window.closeModal = () => document.getElementById('productModal').style.display = 'none';

        window.addToCart = () => {
            let cart = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            cart.push(currentProduct);
            localStorage.setItem('shamma_cart', JSON.stringify(cart));
            updateCartUI();
            closeModal();
            toggleCart();
        }

        window.toggleCart = () => {
            const s = document.getElementById('cartSidebar');
            s.classList.toggle('active');
            if(s.classList.contains('active')) updateCartUI();
        }

        function updateCartUI() {
            const cart = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += parseFloat(item.price);
                container.innerHTML += `
                    <div style="display:flex; gap:10px; margin-bottom:15px; align-items:center; background:#f9f9f9; padding:5px; border-radius:5px;">
                        <img src="${item.img}" style="width:50px; height:50px; object-fit:cover; border-radius:5px;">
                        <div style="flex:1;">
                            <div style="font-size:0.9rem; font-weight:bold;">${item.name}</div>
                            <div style="color:var(--dark);">${item.price} ج.م</div>
                        </div>
                        <i class="fa-solid fa-trash" style="color:red; cursor:pointer; padding:5px;" onclick="window.remItem(${index})"></i>
                    </div>`;
            });
            document.getElementById('cartTotal').innerText = total + " ج.م";
        }

        window.remItem = (i) => {
            let cart = JSON.parse(localStorage.getItem('shamma_cart'));
            cart.splice(i, 1);
            localStorage.setItem('shamma_cart', JSON.stringify(cart));
            updateCartUI();
        }

        window.checkout = async () => {
            const cart = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            if(cart.length === 0) return alert('السلة فارغة');
            const name = prompt('الاسم بالكامل:');
            if(!name) return;
            const phone = prompt('رقم الهاتف للتواصل:');
            if(!phone) return;
            const address = prompt('العنوان بالتفصيل:');
            
            localStorage.setItem('shamma_cust_name', name);
            localStorage.setItem('shamma_user_phone', phone); // تحديث الهاتف بالرقم الحقيقي

            await addDoc(collection(db, "orders"), {
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                items: cart,
                totalPrice: document.getElementById('cartTotal').innerText,
                date: Date.now(),
                status: 'جديد'
            });

            localStorage.removeItem('shamma_cart');
            updateCartUI();
            toggleCart();
            alert('تم استلام طلبك بنجاح! سيتم التواصل معك قريباً.');
        }
    </script>
</body>
</html>
