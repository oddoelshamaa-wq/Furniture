<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشماع | أثاث عصري فاخر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #1a2a3a; --accent: #cda45e; --bg-light: #f8f9fa; --text-dark: #333; --white: #ffffff; --shadow: 0 10px 30px rgba(0, 0, 0, 0.08); --transition: all 0.3s ease; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; }

        .navbar { background-color: var(--white); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; height: 70px; }
        /* تعديل اللوجو ليكون رابط */
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; }
        .logo i { color: var(--accent); margin-left: 10px; }
        
        .nav-links { list-style: none; display: flex; gap: 30px; }
        .nav-links a { color: var(--text-dark); text-decoration: none; font-weight: 600; transition: var(--transition); cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .badge { background: var(--accent); color: white; padding: 2px 6px; border-radius: 50%; font-size: 0.7rem; vertical-align: top; }

        .menu-toggle { display: none; font-size: 1.8rem; cursor: pointer; color: var(--primary); }
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-links { position: absolute; top: 70px; right: 0; width: 100%; background-color: white; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); display: none; z-index: 999; }
            .nav-links.active { display: flex; animation: slideDown 0.3s ease forwards; }
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .hero-section { height: 70vh; background: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero-overlay { background: rgba(0, 0, 0, 0.5); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .hero-content { color: white; padding: 20px; }
        .hero-content h1 { font-size: 2.2rem; margin-bottom: 15px; }
        .cta-btn { padding: 12px 35px; background: var(--accent); color: white; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; transition: var(--transition); }
        .cta-btn:hover { background: #b88e46; transform: translateY(-3px); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; min-height: 60vh; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { color: var(--primary); font-size: 2rem; }
        .line { width: 60px; height: 3px; background: var(--accent); margin: 10px auto; }

        .categories-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .categories-tabs span { padding: 10px 25px; border: 2px solid #ddd; border-radius: 25px; cursor: pointer; background: white; transition: 0.3s; font-weight: bold; font-size: 1.1rem; }
        .categories-tabs span:hover, .categories-tabs span.active-cat { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-3px); }
        .sub-categories-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; min-height: 40px; }
        .sub-categories-tabs span { padding: 6px 15px; background: #eee; border-radius: 15px; cursor: pointer; font-size: 0.9rem; color: #555; transition: 0.3s; }
        .sub-categories-tabs span:hover, .sub-categories-tabs span.active-sub { background: var(--accent); color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: var(--white); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); border: 1px solid #eee; cursor: pointer; }
        .product-card:hover { transform: translateY(-10px); }
        .img-container { height: 250px; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover img { transform: scale(1.1); }
        .discount-badge { position: absolute; top: 15px; right: 15px; background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; z-index: 2; }
        .p-info { padding: 20px; text-align: right; }
        .current-price { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .old-price { text-decoration: line-through; color: #999; font-size: 0.9rem; margin-right: 10px; }

        /* Floating Buttons */
        .floating-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 3000; }
        .float-btn { width: 60px; height: 60px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer; transition: 0.3s; text-decoration: none; }
        .whatsapp-btn { background-color: #25d366; }
        .chat-btn { background-color: var(--primary); }
        .float-btn:hover { transform: scale(1.1); }

        /* Chat Modal */
        #chatModal { display: none; position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: white; border-radius: 15px; box-shadow: var(--shadow); z-index: 3001; flex-direction: column; overflow: hidden; border: 1px solid #eee; }
        .chat-header { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #chatMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f0f2f5; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 0.9rem; }
        .msg-customer { align-self: flex-start; background: var(--accent); color: white; border-bottom-right-radius: 0; }
        .msg-admin { align-self: flex-end; background: white; color: #333; border-bottom-left-radius: 0; }
        .chat-input-area { padding: 10px; display: flex; gap: 5px; background: white; border-top: 1px solid #eee; }
        .chat-input-area input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 20px; }
        .chat-input-area button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 50%; cursor: pointer; }

        /* General Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: var(--white); margin: 5% auto; width: 90%; max-width: 900px; border-radius: 15px; overflow: hidden; position: relative; animation: zoomIn 0.3s; }
        .close-btn { position: absolute; left: 20px; top: 20px; font-size: 20px; cursor: pointer; background: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; color: #333; }
        
        /* Profile Modal Styles */
        .profile-header { background: var(--primary); color: white; padding: 30px; text-align: center; }
        .profile-body { padding: 25px; }
        .profile-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; color: #555; }
        .profile-row i { color: var(--accent); width: 20px; }
        .edit-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }

        footer { background: var(--primary); color: white; padding: 30px; text-align: center; margin-top: 50px; }
        .socials { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 24px; }
        .socials a { color: white; transition: 0.3s; }
        .socials a:hover { color: var(--accent); }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <!-- تم تعديل الشماع ليكون رابط خارجي -->
        <a href="https://www.google.com" class="logo">
            <i class="fa-solid fa-couch"></i> الشماع
        </a>
        <div class="menu-toggle" id="mobile-menu"><i class="fa-solid fa-bars"></i></div>
        <ul class="nav-links" id="nav-list">
            <li><a href="#" class="active">الرئيسية</a></li>
            <li><a href="#" onclick="window.toggleCart()">السلة <span id="cartCount" class="badge">0</span></a></li>
            <li><a href="#" onclick="window.openProfileModal()">حسابي</a></li>
        </ul>
    </nav>

    <div class="floating-container">
        <!-- واتساب بالرقم المطلوب -->
        <a href="https://wa.me/201122884885" target="_blank" class="float-btn whatsapp-btn"><i class="fa-brands fa-whatsapp"></i></a>
        <div class="float-btn chat-btn" onclick="window.toggleChatModal()"><i class="fa-solid fa-comments"></i></div>
    </div>

    <!-- نافذة الشات -->
    <div id="chatModal">
        <div class="chat-header"><span>محادثة الدعم</span><i class="fa-solid fa-xmark" onclick="window.toggleChatModal()" style="cursor:pointer"></i></div>
        <div id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
            <button onclick="window.sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- نافذة حسابي (التي كانت ناقصة) -->
    <div id="profileModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-btn" onclick="window.closeProfileModal()"><i class="fa-solid fa-xmark"></i></span>
            <div class="profile-header">
                <i class="fa-solid fa-user-circle fa-4x"></i>
                <h3 id="profileNameDisplay" style="margin-top: 10px;">ضيف</h3>
            </div>
            <div class="profile-body">
                <div id="profileView">
                    <div class="profile-row"><i class="fa-solid fa-user"></i> <span id="viewName">لم يتم التسجيل</span></div>
                    <div class="profile-row"><i class="fa-solid fa-phone"></i> <span id="viewPhone">--</span></div>
                    <div class="profile-row"><i class="fa-solid fa-location-dot"></i> <span id="viewAddress">--</span></div>
                    <button class="edit-btn" onclick="window.showEditForm()">تعديل البيانات</button>
                </div>
                <form id="profileEditForm" style="display: none;" onsubmit="window.saveProfileData(event)">
                    <input type="text" id="editName" placeholder="الاسم" required style="width:100%; padding:10px; margin-bottom:10px;">
                    <input type="tel" id="editPhone" placeholder="الهاتف" required style="width:100%; padding:10px; margin-bottom:10px;">
                    <input type="text" id="editAddress" placeholder="العنوان" required style="width:100%; padding:10px; margin-bottom:10px;">
                    <button type="submit" class="edit-btn">حفظ</button>
                    <button type="button" onclick="window.hideEditForm()" style="background:#ccc; border:none; padding:10px; width:100%; margin-top:5px; border-radius:8px;">إلغاء</button>
                </form>
            </div>
        </div>
    </div>

    <header id="heroHeader" class="hero-section">
        <div class="hero-overlay">
            <div class="hero-content">
                <h1>فخامة منزلك تبدأ من هنا</h1>
                <p>تصاميم عصرية تجمع بين الراحة والأناقة بأسعار تنافسية.</p>
                <button onclick="window.scrollToProducts()" class="cta-btn">تصفح المجموعة <i class="fa-solid fa-arrow-left"></i></button>
            </div>
        </div>
    </header>

    <div class="container main-content">
        <section id="homeSection">
            <div class="section-title"><h2>أحدث المنتجات</h2><div class="line"></div></div>
            <div id="mainCategoriesTabs" class="categories-tabs"></div>
            <div id="subCategoriesTabs" class="sub-categories-tabs"></div>
            <div class="products-grid" id="productsContainer"><p style="text-align:center; width:100%">جاري تحميل المنتجات...</p></div>
        </section>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2025 معرض الشماع للأثاث</p>
        <div class="socials">
            <a href="https://wa.me/201122884885" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </footer>

    <!-- سكريبت البرمجة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCE7wo3Vwzap7MnP4rv9kFZNwKlFD1myMM",
            authDomain: "furniture-416b8.firebaseapp.com",
            projectId: "furniture-416b8",
            storageBucket: "furniture-416b8.firebasestorage.app",
            messagingSenderId: "827913239758",
            appId: "1:827913239758:web:2fef185ebcf07d80e5e49f",
            measurementId: "G-S13ED1JS79"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentProduct = null;
        let currentMainCat = 'all';
        window.cachedCats = [];

        document.addEventListener('DOMContentLoaded', async () => {
            initMobileMenu();
            await loadMainCategoriesUser();
            await loadProductsUser('all', 'all');
            window.updateCartCount();
            window.loadProfileData(); // تحميل بيانات حسابي
        });

        // --- وظائف حسابي ---
        window.openProfileModal = () => document.getElementById('profileModal').style.display = 'block';
        window.closeProfileModal = () => document.getElementById('profileModal').style.display = 'none';
        window.showEditForm = () => { document.getElementById('profileView').style.display='none'; document.getElementById('profileEditForm').style.display='block'; }
        window.hideEditForm = () => { document.getElementById('profileView').style.display='block'; document.getElementById('profileEditForm').style.display='none'; }
        
        window.loadProfileData = () => {
            let p = JSON.parse(localStorage.getItem('shamma_user_profile'));
            if(p) {
                document.getElementById('profileNameDisplay').innerText = p.name;
                document.getElementById('viewName').innerText = p.name;
                document.getElementById('viewPhone').innerText = p.phone;
                document.getElementById('viewAddress').innerText = p.address;
                document.getElementById('editName').value = p.name;
                document.getElementById('editPhone').value = p.phone;
                document.getElementById('editAddress').value = p.address;
            }
        };

        window.saveProfileData = (e) => {
            e.preventDefault();
            const p = {
                name: document.getElementById('editName').value,
                phone: document.getElementById('editPhone').value,
                address: document.getElementById('editAddress').value
            };
            localStorage.setItem('shamma_user_profile', JSON.stringify(p));
            window.loadProfileData();
            window.hideEditForm();
            alert('تم حفظ البيانات');
        };

        // --- وظائف الشات ---
        window.toggleChatModal = function() {
            const m = document.getElementById('chatModal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
            if(m.style.display === 'flex') { loadMessages(); }
        }

        async function loadMessages() {
            const p = JSON.parse(localStorage.getItem('shamma_user_profile'));
            if(!p || !p.phone) { 
                document.getElementById('chatMessages').innerHTML = '<p style="text-align:center; padding:20px;">يرجى حفظ بياناتك في "حسابي" أولاً للبدء.</p>';
                return;
            }
            const q = query(collection(db, "chats"), where("chatId", "==", p.phone), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chatMessages');
                box.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const cls = data.sender === 'customer' ? 'msg-customer' : 'msg-admin';
                    box.innerHTML += `<div class="msg ${cls}">${data.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendChatMessage = async function() {
            const input = document.getElementById('chatInput');
            const p = JSON.parse(localStorage.getItem('shamma_user_profile'));
            if(!p || !p.phone) { alert('احفظ بياناتك في حسابي أولاً'); return; }
            if(!input.value.trim()) return;

            await addDoc(collection(db, "chats"), {
                chatId: p.phone, sender: 'customer', text: input.value, timestamp: serverTimestamp(), customerName: p.name
            });
            input.value = '';
        }

        // --- بقية الوظائف الأساسية (دون حذف) ---
        function initMobileMenu() { 
            const m=document.getElementById('mobile-menu'); const n=document.getElementById('nav-list'); 
            if(m&&n){ m.addEventListener('click',()=>{ n.classList.toggle('active'); });}
        }

        async function loadMainCategoriesUser() {
            const c=document.getElementById('mainCategoriesTabs'); if(!c)return;
            const snapshot = await getDocs(collection(db, "categories"));
            let cats = snapshot.docs.map(d => d.data());
            window.cachedCats = cats;
            c.innerHTML='<span class="active-cat" onclick="window.selectMainCategory(\'all\',this)">الكل</span>';
            cats.forEach(x=>c.innerHTML+=`<span onclick="window.selectMainCategory('${x.name}',this)">${x.name}</span>`);
        }

        async function loadProductsUser(m,s) {
            const c=document.getElementById('productsContainer');
            c.innerHTML = 'جاري التحميل...';
            const snapshot = await getDocs(collection(db, "products"));
            let products = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
            let f=products; 
            if(m!=='all'){ f=f.filter(x=>x.category===m); if(s!=='all') f=f.filter(x=>x.subCategory===s); }
            c.innerHTML=''; 
            f.forEach(x=>{ 
                let fp=x.discount>0?x.price-(x.price*(x.discount/100)):x.price; 
                c.innerHTML+=`<div class="product-card"><div class="img-container"><img src="${x.img}"></div><div class="p-info"><h3>${x.name}</h3><span class="current-price">${Math.floor(fp)} ج.م</span></div></div>`; 
            });
        }

        window.selectMainCategory = (n,el) => { /* logic here */ loadProductsUser(n,'all'); }
        window.scrollToProducts = () => document.getElementById('homeSection').scrollIntoView({behavior:'smooth'});
        window.updateCartCount = () => { /* logic */ };
    </script>
</body>
</html>
