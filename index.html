<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشماع | أثاث عصري فاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #1a2a3a; --accent: #cda45e; --bg-light: #f8f9fa; --text-dark: #333; --white: #ffffff; --shadow: 0 10px 30px rgba(0, 0, 0, 0.08); --transition: all 0.3s ease; 
        /* Chat Vars */ --wa-bg: #e5ddd5; --wa-user: #dcf8c6; --wa-admin: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; }

        /* Navbar */
        .navbar { background-color: var(--white); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; height: 70px; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); cursor: pointer; }
        .logo i { color: var(--accent); margin-left: 5px; }
        .nav-links { list-style: none; display: flex; gap: 30px; }
        .nav-links a { color: var(--text-dark); text-decoration: none; font-weight: 600; transition: var(--transition); cursor: pointer; }
        .nav-links a:hover { color: var(--accent); }
        .badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 50%; font-size: 0.7rem; vertical-align: top; }

        /* Hero */
        .hero-section { height: 60vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000') no-repeat center center/cover; display: flex; align-items: center; justify-content: center; text-align: center; color: white; }
        .hero-content h1 { font-size: 2.5rem; margin-bottom: 15px; }
        .cta-btn { padding: 12px 35px; background: var(--accent); color: white; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; transition: var(--transition); font-weight: bold; }
        
        /* Categories */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .categories-tabs, .sub-categories-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .categories-tabs span { padding: 10px 25px; border: 2px solid #ddd; border-radius: 25px; cursor: pointer; background: white; transition: 0.3s; font-weight: bold; }
        .categories-tabs span.active-cat { background: var(--primary); color: white; border-color: var(--primary); }
        .sub-categories-tabs span { padding: 6px 15px; background: #eee; border-radius: 15px; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .sub-categories-tabs span.active-sub { background: var(--accent); color: white; }

        /* Products */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: var(--white); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); cursor: pointer; position: relative; }
        .product-card:hover { transform: translateY(-10px); }
        .img-container { height: 250px; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; }
        .discount-badge { position: absolute; top: 15px; right: 15px; background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }
        .p-info { padding: 20px; }
        .current-price { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .old-price { text-decoration: line-through; color: #999; margin-right: 10px; font-size: 0.9rem; }

        /* WhatsApp Style Chat */
        .float-chat-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: #25d366; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 3000; transition:0.3s; }
        .float-chat-btn:hover { transform: scale(1.1); }
        
        #chatModal { display: none; position: fixed; bottom: 90px; right: 20px; width: 340px; height: 500px; background: var(--wa-bg); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 3001; flex-direction: column; overflow: hidden; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .chat-header { background: #075e54; color: white; padding: 15px; display: flex; align-items: center; gap: 10px; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; background: white; }
        #chatMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 0.9rem; position: relative; line-height: 1.4; }
        .msg-me { align-self: flex-end; background: var(--wa-user); border-top-left-radius: 0; }
        .msg-other { align-self: flex-start; background: var(--wa-admin); border-top-right-radius: 0; }
        .chat-input { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; }
        .chat-input input { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
        .chat-input button { background: #128c7e; color: white; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; }

        /* Cart & Modals */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: white; margin: 5% auto; width: 95%; max-width: 600px; border-radius: 20px; padding: 30px; position: relative; animation: zoomIn 0.3s; }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .cart-sidebar { position: fixed; top: 0; left: -400px; width: 350px; height: 100%; background: white; z-index: 2500; transition: 0.4s; box-shadow: 5px 0 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .cart-sidebar.open { left: 0; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="location.reload()"><i class="fa-solid fa-couch"></i> الشماع</div>
        <ul class="nav-links">
            <li><a onclick="window.scrollToProducts()">الرئيسية</a></li>
            <li><a onclick="window.toggleCart()">السلة <span id="cartCount" class="badge">0</span></a></li>
            <li><a onclick="window.openProfile()">طلباتي</a></li>
        </ul>
    </nav>

    <!-- WhatsApp Chat -->
    <div class="float-chat-btn" onclick="toggleChat()"><i class="fa-brands fa-whatsapp"></i></div>
    <div id="chatModal">
        <div class="chat-header">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Admin">
            <div><strong>خدمة العملاء</strong><br><small>متصل الآن</small></div>
            <i class="fa-solid fa-xmark" onclick="toggleChat()" style="margin-right:auto; cursor:pointer"></i>
        </div>
        <div id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="اكتب رسالة...">
            <button onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <header class="hero-section">
        <div class="hero-content">
            <h1>فخامة منزلك تبدأ من هنا</h1>
            <p>تصاميم عصرية تجمع بين الراحة والأناقة</p>
            <button onclick="window.scrollToProducts()" class="cta-btn">تصفح المجموعة</button>
        </div>
    </header>

    <div class="container">
        <section id="homeSection">
            <div style="text-align:center; margin-bottom:30px;"><h2>مجموعاتنا</h2><div style="width:50px; height:3px; background:var(--accent); margin:10px auto;"></div></div>
            <div id="mainCategoriesTabs" class="categories-tabs"></div>
            <div id="subCategoriesTabs" class="sub-categories-tabs"></div>
            <div class="products-grid" id="productsContainer"></div>
        </section>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span onclick="document.getElementById('productModal').style.display='none'" style="position:absolute; left:20px; top:20px; cursor:pointer; font-size:1.5rem;"><i class="fa-solid fa-xmark"></i></span>
            <div class="modal-body" style="text-align:center;">
                <img id="mImg" src="" style="width:100%; height:250px; object-fit:cover; border-radius:10px; margin-bottom:15px;">
                <h2 id="mTitle" style="color:var(--primary);"></h2>
                <p id="mDesc" style="color:#666; margin:10px 0;"></p>
                <div style="margin:20px 0;"><span id="mPrice" class="current-price"></span> <span id="mOldPrice" class="old-price"></span></div>
                <button class="cta-btn" onclick="addToCart()">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span onclick="document.getElementById('profileModal').style.display='none'" style="position:absolute; left:20px; top:20px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></span>
            <h3>سجل طلباتي</h3>
            <div id="myOrdersList" style="margin-top:20px; max-height:400px; overflow-y:auto;"></div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div style="padding:20px; background:var(--primary); color:white; display:flex; justify-content:space-between;">
            <h3>سلة المشتريات</h3><i class="fa-solid fa-xmark" onclick="toggleCart()" style="cursor:pointer"></i>
        </div>
        <div id="cartItems" style="flex:1; padding:20px; overflow-y:auto;"></div>
        <div style="padding:20px; border-top:1px solid #eee;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:15px;"><span>المجموع:</span><span id="totalPrice">0 ج.م</span></div>
            <button class="cta-btn" style="width:100%;" onclick="checkout()">إتمام الطلب</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCE7wo3Vwzap7MnP4rv9kFZNwKlFD1myMM", authDomain: "furniture-416b8.firebaseapp.com", projectId: "furniture-416b8", storageBucket: "furniture-416b8.firebasestorage.app", messagingSenderId: "827913239758", appId: "1:827913239758:web:2fef185ebcf07d80e5e49f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let products = [];
        let categories = [];
        let currentMain = 'all';
        let currentSub = 'all';
        let userPhone = localStorage.getItem('shamma_phone') || 'Guest_' + Math.floor(Math.random()*10000);
        if(!localStorage.getItem('shamma_phone')) localStorage.setItem('shamma_phone', userPhone);

        // 1. جلب الأقسام (مرة واحدة أو استماع)
        onSnapshot(collection(db, "categories"), (snap) => {
            categories = snap.docs.map(d => d.data());
            renderMainCats();
        });

        // 2. جلب المنتجات (REAL-TIME) - هنا السحر، أي تعديل للبائع يظهر فوراً
        onSnapshot(collection(db, "products"), (snap) => {
            products = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderProducts();
        });

        // 3. شات واتساب (REAL-TIME)
        const chatQ = query(collection(db, "chats"), where("chatId", "==", userPhone));
        onSnapshot(chatQ, (snap) => {
            const box = document.getElementById('chatMessages');
            let msgs = [];
            snap.forEach(d => msgs.push(d.data()));
            msgs.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
            box.innerHTML = '';
            msgs.forEach(m => {
                const cls = m.sender === 'customer' ? 'msg-me' : 'msg-other';
                box.innerHTML += `<div class="msg ${cls}">${m.text}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });

        // دوال العرض والفلترة
        function renderMainCats() {
            const t = document.getElementById('mainCategoriesTabs');
            t.innerHTML = `<span class="${currentMain==='all'?'active-cat':''}" onclick="setMain('all')">الكل</span>`;
            categories.forEach(c => {
                t.innerHTML += `<span class="${currentMain===c.name?'active-cat':''}" onclick="setMain('${c.name}')">${c.name}</span>`;
            });
        }

        window.setMain = (name) => {
            currentMain = name;
            currentSub = 'all';
            renderMainCats();
            
            // Render Sub Cats
            const s = document.getElementById('subCategoriesTabs');
            s.innerHTML = '';
            if(name !== 'all') {
                const cat = categories.find(c => c.name === name);
                if(cat && cat.subs) {
                    s.innerHTML = `<span class="active-sub" onclick="setSub('all', this)">الكل</span>`;
                    cat.subs.forEach(sub => s.innerHTML += `<span onclick="setSub('${sub}', this)">${sub}</span>`);
                }
            }
            renderProducts();
        }

        window.setSub = (name, el) => {
            currentSub = name;
            document.querySelectorAll('#subCategoriesTabs span').forEach(e => e.classList.remove('active-sub'));
            el.classList.add('active-sub');
            renderProducts();
        }

        function renderProducts() {
            const c = document.getElementById('productsContainer');
            let f = products;
            if(currentMain !== 'all') f = f.filter(p => p.category === currentMain);
            if(currentSub !== 'all') f = f.filter(p => p.subCategory === currentSub);
            
            c.innerHTML = '';
            f.forEach(p => {
                const finalPrice = p.discount ? p.price - (p.price * p.discount/100) : p.price;
                const pStr = encodeURIComponent(JSON.stringify(p));
                c.innerHTML += `
                    <div class="product-card" onclick="openProd('${pStr}')">
                        <div class="img-container">
                            ${p.discount ? `<span class="discount-badge">-${p.discount}%</span>` : ''}
                            <img src="${p.img}">
                        </div>
                        <div class="p-info">
                            <h3>${p.name}</h3>
                            <div>
                                <span class="current-price">${Math.floor(finalPrice)} ج.م</span>
                                ${p.discount ? `<span class="old-price">${p.price}</span>` : ''}
                            </div>
                        </div>
                    </div>`;
            });
        }

        // منطق المودال والسلة
        window.openProd = (str) => {
            const p = JSON.parse(decodeURIComponent(str));
            window.currProd = p;
            document.getElementById('mImg').src = p.img;
            document.getElementById('mTitle').innerText = p.name;
            document.getElementById('mDesc').innerText = p.desc;
            const fp = p.discount ? p.price - (p.price * p.discount/100) : p.price;
            document.getElementById('mPrice').innerText = Math.floor(fp) + " ج.م";
            document.getElementById('mOldPrice').innerText = p.discount ? p.price : '';
            document.getElementById('productModal').style.display = 'block';
        }

        window.addToCart = () => {
            let cart = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            cart.push({name: window.currProd.name, price: document.getElementById('mPrice').innerText, img: window.currProd.img});
            localStorage.setItem('shamma_cart', JSON.stringify(cart));
            document.getElementById('productModal').style.display = 'none';
            updateCart();
            window.toggleCart();
        }

        window.updateCart = () => {
            const cart = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
            const b = document.getElementById('cartItems');
            b.innerHTML = ''; let tot = 0;
            cart.forEach((i, idx) => {
                tot += parseFloat(i.price);
                b.innerHTML += `<div style="display:flex; gap:10px; margin-bottom:10px; align-items:center;"><img src="${i.img}" width="50"><div style="flex:1"><b>${i.name}</b><br>${i.price}</div><i class="fa-solid fa-trash" style="color:red; cursor:pointer" onclick="remItem(${idx})"></i></div>`;
            });
            document.getElementById('totalPrice').innerText = tot + " ج.م";
        }
        window.remItem = (i) => {
            let c = JSON.parse(localStorage.getItem('shamma_cart')); c.splice(i,1);
            localStorage.setItem('shamma_cart', JSON.stringify(c)); updateCart();
        }
        window.toggleCart = () => document.getElementById('cartSidebar').classList.toggle('open');

        window.checkout = async () => {
            const n = prompt("الاسم:"); if(!n) return;
            const p = prompt("رقم الهاتف:"); if(!p) return;
            const a = prompt("العنوان:");
            localStorage.setItem('shamma_phone', p); // حفظ الهاتف الحقيقي للشات
            
            const cart = JSON.parse(localStorage.getItem('shamma_cart'));
            await addDoc(collection(db, "orders"), {
                customerName: n, customerPhone: p, customerAddress: a,
                items: cart, totalPrice: document.getElementById('totalPrice').innerText,
                date: Date.now(), status: "قيد المراجعة"
            });
            localStorage.removeItem('shamma_cart');
            updateCart(); window.toggleCart();
            alert("تم إرسال الطلب بنجاح!");
        }

        // الشات والبروفايل
        window.toggleChat = () => {
            const m = document.getElementById('chatModal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }
        window.sendChat = async () => {
            const t = document.getElementById('chatInput').value;
            if(!t) return;
            document.getElementById('chatInput').value = '';
            await addDoc(collection(db, "chats"), {
                chatId: userPhone, text: t, sender: 'customer', timestamp: serverTimestamp(), customerName: localStorage.getItem('shamma_name') || 'عميل'
            });
        }

        window.openProfile = async () => {
            const p = localStorage.getItem('shamma_phone');
            if(!p || p.startsWith('Guest')) { alert('يجب عليك عمل طلب أولاً لتسجيل حسابك'); return; }
            const q = query(collection(db, "orders"), where("customerPhone", "==", p));
            const snap = await getDocs(q);
            const list = document.getElementById('myOrdersList'); list.innerHTML = '';
            snap.forEach(d => {
                const o = d.data();
                list.innerHTML += `<div style="background:#f9f9f9; padding:10px; margin-bottom:10px; border-radius:8px;"><b>${new Date(o.date).toLocaleDateString()}</b> - ${o.status}<br>${o.totalPrice}</div>`;
            });
            document.getElementById('profileModal').style.display = 'block';
        }

        window.scrollToProducts = () => document.getElementById('homeSection').scrollIntoView({behavior:'smooth'});
        updateCart();
    </script>
</body>
</html>
