<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الشماع | أثاث عصري فاخر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #1a2a3a; --accent: #cda45e; --bg-light: #f8f9fa; --text-dark: #333; --white: #ffffff; --shadow: 0 10px 30px rgba(0, 0, 0, 0.08); --transition: all 0.3s ease; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; }

        .navbar { background-color: var(--white); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; height: 70px; }
        /* تعديل: اللوجو والروابط تعمل ريفريش */
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); cursor: pointer; }
        .logo i { color: var(--accent); margin-left: 5px; }
        .nav-links { list-style: none; display: flex; gap: 30px; }
        .nav-links a { color: var(--text-dark); text-decoration: none; font-weight: 600; transition: var(--transition); cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .badge { background: var(--accent); color: white; padding: 2px 6px; border-radius: 50%; font-size: 0.7rem; vertical-align: top; }

        .menu-toggle { display: none; font-size: 1.8rem; cursor: pointer; color: var(--primary); }
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav-links { position: absolute; top: 70px; right: 0; width: 100%; background-color: white; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); display: none; z-index: 999; }
            .nav-links.active { display: flex; animation: slideDown 0.3s ease forwards; }
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .hero-section { height: 70vh; background: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover; position: relative; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero-overlay { background: rgba(0, 0, 0, 0.5); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .hero-content { color: white; padding: 20px; }
        .hero-content h1 { font-size: 2.2rem; margin-bottom: 15px; }
        .cta-btn { padding: 12px 35px; background: var(--accent); color: white; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; transition: var(--transition); }
        .cta-btn:hover { background: #b88e46; transform: translateY(-3px); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; min-height: 60vh; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { color: var(--primary); font-size: 2rem; }
        .line { width: 60px; height: 3px; background: var(--accent); margin: 10px auto; }

        .categories-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .categories-tabs span { padding: 10px 25px; border: 2px solid #ddd; border-radius: 25px; cursor: pointer; background: white; transition: 0.3s; font-weight: bold; font-size: 1.1rem; }
        .categories-tabs span:hover, .categories-tabs span.active-cat { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-3px); }
        .sub-categories-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; min-height: 40px; }
        .sub-categories-tabs span { padding: 6px 15px; background: #eee; border-radius: 15px; cursor: pointer; font-size: 0.9rem; color: #555; transition: 0.3s; }
        .sub-categories-tabs span:hover, .sub-categories-tabs span.active-sub { background: var(--accent); color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: var(--white); border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); border: 1px solid #eee; cursor: pointer; }
        .product-card:hover { transform: translateY(-10px); }
        .img-container { height: 250px; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .product-card:hover img { transform: scale(1.1); }
        .discount-badge { position: absolute; top: 15px; right: 15px; background: #e74c3c; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; z-index: 2; }
        .p-info { padding: 20px; text-align: right; }
        .current-price { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .old-price { text-decoration: line-through; color: #999; font-size: 0.9rem; margin-right: 10px; }

        /* Floating Buttons */
        .floating-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 3000; }
        .float-btn { width: 60px; height: 60px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); cursor: pointer; transition: 0.3s; text-decoration: none; }
        .whatsapp-btn { background-color: #25d366; }
        .chat-btn { background-color: var(--primary); }
        .float-btn:hover { transform: scale(1.1); }

        /* Chat Modal */
        #chatModal { display: none; position: fixed; bottom: 90px; right: 20px; width: 350px; height: 450px; background: white; border-radius: 15px; box-shadow: var(--shadow); z-index: 3001; flex-direction: column; overflow: hidden; border: 1px solid #eee; }
        .chat-header { background: var(--primary); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #chatMessages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f0f2f5; }
        .msg { padding: 8px 12px; border-radius: 15px; max-width: 80%; font-size: 0.9rem; }
        .msg-customer { align-self: flex-start; background: var(--accent); color: white; border-bottom-right-radius: 0; }
        .msg-admin { align-self: flex-end; background: white; color: #333; border-bottom-left-radius: 0; }
        .chat-input-area { padding: 10px; display: flex; gap: 5px; background: white; border-top: 1px solid #eee; }
        .chat-input-area input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 20px; }
        .chat-input-area button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 50%; cursor: pointer; }

        /* Sidebar Cart */
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1100; display: none; backdrop-filter: blur(2px); }
        .cart-sidebar { position: fixed; top: 0; left: -400px; width: 350px; height: 100%; background: white; z-index: 1200; box-shadow: 5px 0 15px rgba(0,0,0,0.1); transition: left 0.4s ease; display: flex; flex-direction: column; }
        .cart-sidebar.open { left: 0; }
        .cart-header { padding: 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .close-cart { cursor: pointer; font-size: 1.2rem; }
        .cart-items-container { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .cart-footer { padding: 20px; background: #f9f9f9; border-top: 1px solid #eee; }
        .total-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; font-size: 1.1rem; }
        .checkout-btn { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
        .modal-content { background: var(--white); margin: 5% auto; width: 90%; max-width: 900px; border-radius: 15px; overflow: hidden; position: relative; animation: zoomIn 0.3s; }
        .modal-body { display: flex; flex-wrap: wrap; }
        .modal-img-wrapper { flex: 1; min-width: 300px; height: 450px; }
        .modal-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .m-details { flex: 1; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .category-tag { background: #eee; color: #666; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; }
        .category-tag.sub-tag { background: var(--accent); color: white; margin-right: 5px; }
        .action-buttons { display: flex; gap: 15px; margin-top: 20px; }
        .action-buttons button { flex: 1; padding: 15px; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-buy { background: var(--primary); color: white; }
        .btn-reserve { background: white; border: 2px solid var(--accent); color: var(--accent); }
        .close-btn { position: absolute; left: 20px; top: 20px; font-size: 20px; cursor: pointer; background: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; color: #333; }

        form { background: white; padding: 25px; border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 15px; max-width: 600px; margin: 0 auto; }
        input, textarea, select { padding: 12px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        footer { background: var(--primary); color: white; padding: 30px; text-align: center; margin-top: 50px; }
        .socials { display: flex; justify-content: center; gap: 20px; margin-top: 15px; font-size: 24px; }
        .socials a { color: white; transition: 0.3s; }
        .socials a:hover { color: var(--accent); }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="logo" onclick="location.reload()"><i class="fa-solid fa-couch"></i> الشماع</div>
        <div class="menu-toggle" id="mobile-menu"><i class="fa-solid fa-bars"></i></div>
        <ul class="nav-links" id="nav-list">
            <li><a href="#" class="active" onclick="location.reload()">الرئيسية</a></li>
            <li><a href="#" onclick="window.toggleCart()">السلة <span id="cartCount" class="badge">0</span></a></li>
            <li><a href="#" onclick="window.openProfileModal()">حسابي</a></li>
        </ul>
    </nav>

    <div class="floating-container">
        <a href="https://wa.me/201122884885" target="_blank" class="float-btn whatsapp-btn"><i class="fa-brands fa-whatsapp"></i></a>
        <div class="float-btn chat-btn" onclick="window.toggleChatModal()"><i class="fa-solid fa-comments"></i></div>
    </div>

    <!-- نافذة الشات -->
    <div id="chatModal">
        <div class="chat-header"><span>محادثة الدعم</span><i class="fa-solid fa-xmark" onclick="window.toggleChatModal()" style="cursor:pointer"></i></div>
        <div id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
            <button onclick="window.sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <header id="heroHeader" class="hero-section">
        <div class="hero-overlay">
            <div class="hero-content">
                <h1>فخامة منزلك تبدأ من هنا</h1>
                <p>تصاميم عصرية تجمع بين الراحة والأناقة بأسعار تنافسية.</p>
                <button onclick="window.scrollToProducts()" class="cta-btn">تصفح المجموعة <i class="fa-solid fa-arrow-left"></i></button>
            </div>
        </div>
    </header>

    <div class="container main-content">
        <section id="homeSection">
            <div class="section-title"><h2>أحدث المنتجات</h2><div class="line"></div></div>
            <div id="mainCategoriesTabs" class="categories-tabs"></div>
            <div id="subCategoriesTabs" class="sub-categories-tabs"></div>
            <div class="products-grid" id="productsContainer"><p style="text-align:center; width:100%">جاري تحميل المنتجات...</p></div>
        </section>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2025 معرض الشماع للأثاث</p>
        <div class="socials">
            <a href="https://wa.me/201122884885" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </footer>

    <!-- بقية النوافذ -->
    <div class="cart-overlay" id="cartOverlay" onclick="window.toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header"><h3>سلة المشتريات</h3><span class="close-cart" onclick="window.toggleCart()"><i class="fa-solid fa-xmark"></i></span></div>
        <div id="cartItems" class="cart-items-container"></div>
        <div class="cart-footer">
            <div class="total-row"><span>المجموع:</span><span id="totalPrice">0 ج.م</span></div>
            <button class="checkout-btn" onclick="window.openCheckoutModal()">إتمام الطلب</button>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="window.closeModal()"><i class="fa-solid fa-xmark"></i></span>
            <div class="modal-body">
                <div class="modal-img-wrapper"><img id="mImg" src="" alt=""></div>
                <div class="m-details">
                    <h2 id="mTitle"></h2>
                    <div style="margin-bottom: 15px;"><span class="category-tag" id="mCatTag"></span><span class="category-tag sub-tag" id="mSubCatTag"></span></div>
                    <p id="mDesc"></p>
                    <div class="price-wrapper"><span id="mPrice" class="current-price"></span><span id="mOldPrice" class="old-price"></span></div>
                    <div class="action-buttons">
                        <button class="btn-buy" onclick="window.addToCart('buy')"><i class="fa-solid fa-cart-shopping"></i> إضافة للسلة</button>
                        <button class="btn-reserve" onclick="window.prepareDirectOrder('reserve')"><i class="fa-regular fa-calendar-check"></i> حجز مباشر</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-btn" onclick="window.closeCheckoutModal()"><i class="fa-solid fa-xmark"></i></span>
            <div style="padding: 20px;">
                <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">تأكيد الطلب</h2>
                <form id="customerDetailsForm" onsubmit="window.finalizeOrder(event)">
                    <input type="text" id="cName" placeholder="الاسم بالكامل" required>
                    <input type="tel" id="cPhone" placeholder="رقم الهاتف" required>
                    <textarea id="cAddress" placeholder="العنوان بالتفصيل" required></textarea>
                    <button type="submit" class="checkout-btn">إرسال الطلب</button>
                </form>
            </div>
        </div>
    </div>

    <!-- نافذة حسابي -->
    <div id="profileModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" onclick="document.getElementById('profileModal').style.display='none'"><i class="fa-solid fa-xmark"></i></span>
            <div style="padding: 20px;">
                <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">ملفي الشخصي</h2>
                <div id="profileInfo" style="background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px;"></div>
                <h3>طلباتي السابقة:</h3>
                <div id="myOrdersList" style="max-height: 300px; overflow-y: auto; margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- سكريبت البرمجة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCE7wo3Vwzap7MnP4rv9kFZNwKlFD1myMM",
            authDomain: "furniture-416b8.firebaseapp.com",
            projectId: "furniture-416b8",
            storageBucket: "furniture-416b8.firebasestorage.app",
            messagingSenderId: "827913239758",
            appId: "1:827913239758:web:2fef185ebcf07d80e5e49f",
            measurementId: "G-S13ED1JS79"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentProduct = null;
        let currentMainCat = 'all';
        window.cachedCats = [];

        document.addEventListener('DOMContentLoaded', async () => {
            initMobileMenu();
            await loadMainCategoriesUser();
            await loadProductsUser('all', 'all');
            window.updateCartCount();
        });

        // الشات
        window.toggleChatModal = function() {
            const m = document.getElementById('chatModal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
            if(m.style.display === 'flex') { loadMessages(); }
        }

        async function loadMessages() {
            const p = JSON.parse(localStorage.getItem('shamma_user_profile'));
            if(!p || !p.phone) { 
                document.getElementById('chatMessages').innerHTML = '<p style="text-align:center; padding:20px;">يرجى إتمام طلب أولاً ليتم التعرف على حسابك وبدء المحادثة.</p>';
                return;
            }
            const q = query(collection(db, "chats"), where("chatId", "==", p.phone), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById('chatMessages');
                box.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const cls = data.sender === 'customer' ? 'msg-customer' : 'msg-admin';
                    box.innerHTML += `<div class="msg ${cls}">${data.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendChatMessage = async function() {
            const input = document.getElementById('chatInput');
            const p = JSON.parse(localStorage.getItem('shamma_user_profile'));
            if(!p || !p.phone) { alert('سجل بياناتك عبر إرسال طلب أولاً'); return; }
            if(!input.value.trim()) return;

            await addDoc(collection(db, "chats"), {
                chatId: p.phone,
                sender: 'customer',
                text: input.value,
                timestamp: serverTimestamp(),
                customerName: p.name
            });
            input.value = '';
        }

        // الحساب الشخصي
        window.openProfileModal = async function() {
            const p = JSON.parse(localStorage.getItem('shamma_user_profile'));
            const infoBox = document.getElementById('profileInfo');
            const ordersBox = document.getElementById('myOrdersList');
            
            if(!p) {
                infoBox.innerHTML = '<p style="text-align:center;">لم يتم تسجيل بيانات بعد. قم بإجراء أول طلب لك ليتم إنشاء ملفك.</p>';
                document.getElementById('profileModal').style.display = 'block';
                return;
            }

            infoBox.innerHTML = `<p><strong>الاسم:</strong> ${p.name}</p><p><strong>الهاتف:</strong> ${p.phone}</p><p><strong>العنوان:</strong> ${p.address}</p>`;
            document.getElementById('profileModal').style.display = 'block';
            ordersBox.innerHTML = 'جاري تحميل الطلبات...';

            const q = query(collection(db, "orders"), where("customerPhone", "==", p.phone), orderBy("date", "desc"));
            const snapshot = await getDocs(q);
            
            if(snapshot.empty) {
                ordersBox.innerHTML = '<p style="text-align:center;">لا توجد طلبات مسجلة.</p>';
            } else {
                ordersBox.innerHTML = '';
                snapshot.forEach(doc => {
                    const order = doc.data();
                    ordersBox.innerHTML += `<div style="border-bottom:1px solid #eee; padding:10px 0;"><div style="display:flex; justify-content:space-between;"><strong>طلب رقم: ${doc.id.substring(0,6)}</strong><span style="color:var(--accent)">${order.status}</span></div><p style="font-size:0.9rem;">الإجمالي: ${order.totalPrice}</p></div>`;
                });
            }
        }

        // الوظائف الأصلية
        function initMobileMenu() { 
            const m=document.getElementById('mobile-menu'); const n=document.getElementById('nav-list'); 
            if(m&&n){ m.addEventListener('click',()=>{ n.classList.toggle('active'); });}
        }

        async function loadMainCategoriesUser() {
            const c=document.getElementById('mainCategoriesTabs'); if(!c)return;
            const snapshot = await getDocs(collection(db, "categories"));
            let cats = snapshot.docs.map(d => d.data());
            window.cachedCats = cats;
            c.innerHTML='<span class="active-cat" onclick="window.selectMainCategory(\'all\',this)">الكل</span>';
            cats.forEach(x=>c.innerHTML+=`<span onclick="window.selectMainCategory('${x.name}',this)">${x.name}</span>`);
        }

        async function loadProductsUser(m,s) {
            const c=document.getElementById('productsContainer');
            c.innerHTML = 'جاري التحميل...';
            const snapshot = await getDocs(collection(db, "products"));
            let products = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
            let f=products; 
            if(m!=='all'){ f=f.filter(x=>x.category===m); if(s!=='all') f=f.filter(x=>x.subCategory===s); }
            c.innerHTML=''; 
            f.forEach(x=>{ 
                let fp=x.discount>0?x.price-(x.price*(x.discount/100)):x.price; 
                const prodString = encodeURIComponent(JSON.stringify(x));
                c.innerHTML+=`<div class="product-card" onclick="window.openProductModalDecode('${prodString}')"><div class="img-container">${x.discount>0?`<span class="discount-badge">-${x.discount}%</span>`:''}<img src="${x.img}"></div><div class="p-info"><h3>${x.name}</h3><div class="price-row"><span class="current-price">${Math.floor(fp)} ج.م</span>${x.discount>0?`<span class="old-price">${x.price}</span>`:''}</div></div></div>`; 
            });
        }

        window.selectMainCategory = function(n,el){ 
            currentMainCat=n; 
            document.querySelectorAll('#mainCategoriesTabs span').forEach(s=>s.classList.remove('active-cat')); 
            el.classList.add('active-cat'); 
            const sc=document.getElementById('subCategoriesTabs'); sc.innerHTML='';
            if(n!=='all' && window.cachedCats){ 
                let t=window.cachedCats.find(c=>c.name===n); 
                if(t&&t.subs){ 
                    sc.innerHTML='<span class="active-sub" onclick="window.filterBySub(\'all\',this)">الكل</span>'; 
                    t.subs.forEach(s=>sc.innerHTML+=`<span onclick="window.filterBySub('${s}',this)">${s}</span>`); 
                } 
            } 
            loadProductsUser(n,'all');
        }
        window.filterBySub = function(s,el){ document.querySelectorAll('#subCategoriesTabs span').forEach(x=>x.classList.remove('active-sub')); el.classList.add('active-sub'); loadProductsUser(currentMainCat,s); }

        window.openProductModalDecode = function(str) {
            const p = JSON.parse(decodeURIComponent(str));
            currentProduct = p;
            document.getElementById('mImg').src=p.img; document.getElementById('mTitle').innerText=p.name; document.getElementById('mCatTag').innerText=p.category; document.getElementById('mSubCatTag').innerText=p.subCategory||''; document.getElementById('mDesc').innerText=p.desc; let fp=p.discount>0?p.price-(p.price*(p.discount/100)):p.price; document.getElementById('mPrice').innerText=Math.floor(fp)+" ج.م"; let old=document.getElementById('mOldPrice'); if(p.discount>0){old.innerText=p.price;old.style.display='inline';}else{old.style.display='none';} document.getElementById('productModal').style.display='block';
        }
        window.closeModal = function() { document.getElementById('productModal').style.display='none'; }
        window.addToCart = function(type) { if(!currentProduct)return; let cart=JSON.parse(localStorage.getItem('shamma_cart'))||[]; cart.push({id:Date.now(), productId:currentProduct.id, productName:currentProduct.name, price:document.getElementById('mPrice').innerText, type:type==='buy'?'شراء':'حجز'}); localStorage.setItem('shamma_cart',JSON.stringify(cart)); window.closeModal(); window.updateCartCount(); window.toggleCart(); }
        window.prepareDirectOrder = function(type) { currentProduct.tempType = type; window.closeModal(); window.openCheckoutModal(); }

        window.toggleCart = function(){ let s=document.getElementById('cartSidebar'); let o=document.getElementById('cartOverlay'); if(s.classList.contains('open')){s.classList.remove('open');o.style.display='none';}else{s.classList.add('open');o.style.display='block'; window.loadCart();}}
        window.loadCart = function(){ let c=JSON.parse(localStorage.getItem('shamma_cart'))||[]; let d=document.getElementById('cartItems'); let t=document.getElementById('totalPrice'); d.innerHTML=''; let sum=0; if(c.length===0){d.innerHTML='<p>فارغة</p>';t.innerText='0';return;} c.forEach(i=>{ let p=parseFloat(i.price.replace(/[^0-9.]/g,'')); if(!isNaN(p))sum+=p; d.innerHTML+=`<div class="cart-item"><div><b>${i.productName}</b><br><small>${i.type}</small></div><b>${i.price}</b></div>`;}); t.innerText=Math.floor(sum)+" ج.م"; }
        window.updateCartCount = function(){ let c=JSON.parse(localStorage.getItem('shamma_cart'))||[]; document.getElementById('cartCount').innerText=c.length;}
        window.scrollToProducts = function() { document.getElementById('homeSection').scrollIntoView({ behavior: 'smooth' }); }

        window.openCheckoutModal = function() { document.getElementById('checkoutModal').style.display='block'; }
        window.closeCheckoutModal = function() { document.getElementById('checkoutModal').style.display='none'; }

        window.finalizeOrder = async function(e) {
            e.preventDefault();
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            const addr = document.getElementById('cAddress').value;
            localStorage.setItem('shamma_user_profile', JSON.stringify({name, phone, address: addr}));
            
            let items = JSON.parse(localStorage.getItem('shamma_cart')) || [];
            let total = document.getElementById('totalPrice').innerText;
            
            if(currentProduct && currentProduct.tempType) {
                items = [{ productName: currentProduct.name, price: document.getElementById('mPrice').innerText, type: 'حجز مباشر' }];
                total = document.getElementById('mPrice').innerText;
            }

            await addDoc(collection(db, "orders"), { customerName: name, customerPhone: phone, customerAddress: addr, items: items, totalPrice: total, date: Date.now(), status: 'قيد المراجعة' });
            localStorage.removeItem('shamma_cart');
            alert('تم الطلب بنجاح');
            location.reload();
        }
    </script>
</body>
</html>
