<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشماع - واتساب ستايل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --wa-header: #00a884; --wa-bg: #111b21; --wa-panel: #202c33; --wa-list-active: #2a3942; --wa-msg-out: #005c4b; --wa-msg-in: #202c33; --text: #e9edef; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #0c1317; color: var(--text); height: 100vh; overflow: hidden; display: flex; }

        /* Sidebar */
        .sidebar { width: 60px; background: var(--wa-panel); display: flex; flex-direction: column; align-items: center; padding-top: 20px; border-left: 1px solid rgba(255,255,255,0.1); gap: 20px; z-index: 10; }
        .sidebar i { font-size: 1.4rem; color: #aebac1; cursor: pointer; transition: 0.3s; padding: 10px; border-radius: 50%; }
        .sidebar i.active, .sidebar i:hover { color: var(--wa-header); background: rgba(255,255,255,0.05); }

        /* Main Content */
        .main-area { flex: 1; display: flex; height: 100vh; position: relative; }
        
        /* Section Styles */
        .section { display: none; width: 100%; height: 100%; }
        .section.active { display: flex; }

        /* CHAT SECTION LAYOUT (WhatsApp Web Style) */
        .chat-list { width: 30%; min-width: 300px; background: var(--wa-bg); border-left: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; }
        .chat-view { flex: 1; background: #0b141a; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); opacity: 0.95; display: flex; flex-direction: column; position: relative; }
        .chat-view::before { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:#0b141a; opacity:0.9; z-index:0; }

        /* Chat Items */
        .cl-header { height: 60px; background: var(--wa-panel); display: flex; align-items: center; padding: 0 15px; font-weight: bold; border-right: 1px solid rgba(255,255,255,0.1); }
        .cl-items { flex: 1; overflow-y: auto; }
        .cl-item { display: flex; align-items: center; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .cl-item:hover, .cl-item.active { background: var(--wa-list-active); }
        .cl-avatar { width: 45px; height: 45px; border-radius: 50%; background: #dfe5e7; margin-left: 15px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 20px; }
        .cl-info h4 { font-size: 1rem; color: var(--text); margin-bottom: 3px; }
        .cl-info p { font-size: 0.85rem; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

        /* Chat Box */
        .cv-header { height: 60px; background: var(--wa-panel); padding: 0 20px; display: flex; align-items: center; z-index: 1; border-right: 1px solid rgba(255,255,255,0.1); }
        .cv-body { flex: 1; overflow-y: auto; padding: 20px 5%; display: flex; flex-direction: column; gap: 5px; z-index: 1; }
        .cv-footer { height: 65px; background: var(--wa-panel); padding: 10px 20px; display: flex; align-items: center; gap: 15px; z-index: 1; }
        
        .bubble { padding: 8px 12px; border-radius: 8px; max-width: 65%; font-size: 0.95rem; position: relative; color: var(--text); box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); line-height: 1.5; }
        .bubble-in { align-self: flex-start; background: var(--wa-msg-in); border-top-right-radius: 0; }
        .bubble-out { align-self: flex-end; background: var(--wa-msg-out); border-top-left-radius: 0; }
        .bubble-time { font-size: 0.7rem; color: #8696a0; float: left; margin-top: 5px; margin-right: -5px; margin-left: 10px; }

        .cv-footer input { flex: 1; background: #2a3942; border: none; padding: 12px 15px; border-radius: 8px; color: white; outline: none; }
        .cv-footer button { background: transparent; border: none; color: #8696a0; font-size: 1.5rem; cursor: pointer; }
        
        /* Dashboard & Products & Orders (Styled Dark) */
        .page-content { padding: 30px; width: 100%; overflow-y: auto; background: var(--wa-bg); }
        h2 { border-bottom: 2px solid var(--wa-header); padding-bottom: 10px; margin-bottom: 20px; color: var(--wa-header); }
        
        table { width: 100%; border-collapse: collapse; background: var(--wa-panel); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: #2a3942; color: var(--wa-header); }
        tr:hover { background: rgba(255,255,255,0.03); }

        .form-group { margin-bottom: 15px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; background: var(--wa-panel); border: 1px solid #2a3942; color: white; border-radius: 5px; outline: none; }
        .btn-submit { background: var(--wa-header); color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }

        /* Sound Enable Overlay */
        #soundOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #soundOverlay button { padding: 15px 40px; font-size: 1.2rem; background: var(--wa-header); color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Sound Activation -->
    <div id="soundOverlay">
        <h1 style="color:white; margin-bottom:10px;">لوحة تحكم الشماع</h1>
        <p style="color:#aaa;">يجب تفعيل التنبيهات الصوتية للبدء</p>
        <button onclick="enableSound()">بدء العمل <i class="fa-solid fa-play"></i></button>
    </div>

    <aside class="sidebar">
        <i class="fa-solid fa-comments active" onclick="switchTab('chat')"></i>
        <i class="fa-solid fa-cart-shopping" onclick="switchTab('orders')"></i>
        <i class="fa-solid fa-plus-circle" onclick="switchTab('add')"></i>
    </aside>

    <main class="main-area">
        
        <!-- Chat Section -->
        <section id="chat" class="section active">
            <div class="chat-list">
                <div class="cl-header">المحادثات</div>
                <div class="cl-items" id="chatUsersList">
                    <!-- Users Loaded via Firebase -->
                </div>
            </div>
            <div class="chat-view">
                <div class="cv-header" id="activeChatHeader">اختر محادثة...</div>
                <div class="cv-body" id="adminChatMessages"></div>
                <div class="cv-footer" id="chatFooter" style="visibility:hidden;">
                    <input type="text" id="adminMsgInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendAdminMsg()">
                    <button onclick="sendAdminMsg()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </section>

        <!-- Orders Section -->
        <section id="orders" class="section">
            <div class="page-content">
                <h2>الطلبات الواردة</h2>
                <table>
                    <thead><tr><th>العميل</th><th>الهاتف</th><th>المنتجات</th><th>الإجمالي</th><th>الحالة</th><th>حذف</th></tr></thead>
                    <tbody id="ordersTable"></tbody>
                </table>
            </div>
        </section>

        <!-- Add Product Section -->
        <section id="add" class="section">
            <div class="page-content">
                <h2>إضافة منتج جديد</h2>
                <div style="max-width: 600px; margin: 0 auto;">
                    <div class="form-group"><input type="text" id="pName" placeholder="اسم المنتج"></div>
                    <div class="form-group"><input type="text" id="pImg" placeholder="رابط الصورة (URL)"></div>
                    <div class="form-group"><input type="text" id="pCategory" placeholder="القسم (مثال: غرف نوم)"></div>
                    <div class="form-group"><input type="number" id="pPrice" placeholder="السعر"></div>
                    <div class="form-group"><textarea id="pDesc" rows="5" placeholder="وصف المنتج"></textarea></div>
                    <button class="btn-submit" onclick="addProduct()">نشر المنتج فوراً</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Hidden Audio -->
    <audio id="alertSound" src="https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCE7wo3Vwzap7MnP4rv9kFZNwKlFD1myMM", authDomain: "furniture-416b8.firebaseapp.com", projectId: "furniture-416b8", storageBucket: "furniture-416b8.firebasestorage.app", messagingSenderId: "827913239758", appId: "1:827913239758:web:2fef185ebcf07d80e5e49f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeChatId = null;
        const sound = document.getElementById('alertSound');

        // Sound Enabler
        window.enableSound = () => {
            sound.play().then(() => {
                sound.pause();
                sound.currentTime = 0;
                document.getElementById('soundOverlay').style.display = 'none';
            }).catch(e => console.log('Audio init failed', e));
        }

        function playAlert() {
            sound.currentTime = 0;
            sound.play().catch(e => console.log('Autoplay blocked'));
        }

        // 1. إدارة الطلبات (Real-time + Sound)
        const qOrders = query(collection(db, "orders"), orderBy("date", "desc"));
        onSnapshot(qOrders, (snapshot) => {
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = '';
            
            // التحقق من وجود طلبات جديدة للتنبيه
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    // إذا كان الطلب جديداً جداً (أقل من دقيقة)، شغل الصوت
                    const isNew = (Date.now() - change.doc.data().date) < 60000;
                    if(isNew) playAlert();
                }
            });

            snapshot.forEach(d => {
                const o = d.data();
                const itemsStr = o.items.map(i => i.name).join(', ');
                tbody.innerHTML += `
                    <tr>
                        <td>${o.customerName}</td>
                        <td>${o.customerPhone}</td>
                        <td>${itemsStr}</td>
                        <td style="color:#00a884; font-weight:bold;">${o.totalPrice}</td>
                        <td>${o.status}</td>
                        <td><i class="fa-solid fa-trash" style="color:#e53935; cursor:pointer;" onclick="window.delOrder('${d.id}')"></i></td>
                    </tr>`;
            });
        });

        // 2. إدارة الشات (Real-time List + Messages)
        // جلب قائمة المتحدثين (تجميع يدوي بسيط)
        onSnapshot(collection(db, "chats"), (snapshot) => {
            let users = {};
            // نتحقق من الرسائل الجديدة للتنبيه
            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                   const data = change.doc.data();
                   // صوت فقط إذا كانت الرسالة من العميل وجديدة
                   if(data.sender === 'customer' && (Date.now() - (data.timestamp?.seconds * 1000 || Date.now())) < 10000) {
                       playAlert();
                   }
                }
            });

            snapshot.forEach(d => {
                const data = d.data();
                if(!users[data.chatId]) {
                    users[data.chatId] = { name: data.customerName || 'عميل', lastMsg: '', id: data.chatId };
                }
                users[data.chatId].lastMsg = data.text; // تحديث آخر رسالة
            });

            const list = document.getElementById('chatUsersList');
            list.innerHTML = '';
            Object.values(users).forEach(u => {
                const activeClass = activeChatId === u.id ? 'active' : '';
                list.innerHTML += `
                    <div class="cl-item ${activeClass}" onclick="window.loadChat('${u.id}', '${u.name}')">
                        <div class="cl-avatar"><i class="fa-solid fa-user"></i></div>
                        <div class="cl-info">
                            <h4>${u.name}</h4>
                            <p>${u.lastMsg}</p>
                        </div>
                    </div>`;
            });
        });

        window.loadChat = (chatId, name) => {
            activeChatId = chatId;
            document.getElementById('activeChatHeader').innerHTML = `<div style="display:flex; align-items:center; gap:10px;"><div class="cl-avatar" style="width:35px; height:35px; margin:0; font-size:15px;"><i class="fa-solid fa-user"></i></div> ${name}</div>`;
            document.getElementById('chatFooter').style.visibility = 'visible';
            
            // Highlight active user
            document.querySelectorAll('.cl-item').forEach(el => el.classList.remove('active'));
            // (Re-rendering logic in onSnapshot handles the active class update based on activeChatId)

            const qMsg = query(collection(db, "chats"), where("chatId", "==", chatId));
            
            // إلغاء الاشتراك السابق إذا وجد (للتبسيط سنعتمد على التحديث المباشر)
            // ملاحظة: في التطبيقات الكبيرة يجب إدارة الـ listeners، هنا للسرعة نعتمد على استبدال المحتوى
            onSnapshot(qMsg, (snap) => {
                if(activeChatId !== chatId) return; // منع التداخل
                const box = document.getElementById('adminChatMessages');
                let msgs = [];
                snap.forEach(d => msgs.push(d.data()));
                msgs.sort((a,b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

                box.innerHTML = '';
                msgs.forEach(m => {
                    const type = m.sender === 'admin' ? 'bubble-out' : 'bubble-in';
                    const time = m.timestamp ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                    box.innerHTML += `
                        <div class="bubble ${type}">
                            ${m.text}
                            <span class="bubble-time">${time}</span>
                        </div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        };

        window.sendAdminMsg = async () => {
            const inp = document.getElementById('adminMsgInput');
            const txt = inp.value.trim();
            if(!txt || !activeChatId) return;
            inp.value = '';
            await addDoc(collection(db, "chats"), {
                chatId: activeChatId,
                sender: 'admin',
                text: txt,
                timestamp: serverTimestamp()
            });
        };

        // 3. إضافة المنتجات
        window.addProduct = async () => {
            const name = document.getElementById('pName').value;
            const img = document.getElementById('pImg').value;
            const cat = document.getElementById('pCategory').value;
            const price = document.getElementById('pPrice').value;
            const desc = document.getElementById('pDesc').value;

            if(!name || !price) return alert('البيانات ناقصة');

            await addDoc(collection(db, "products"), {
                name, img, category: cat, price, desc, date: Date.now()
            });
            alert('تم نشر المنتج وتحديث موقع العميل فوراً!');
            // مسح الحقول
            document.querySelectorAll('#add input, #add textarea').forEach(i => i.value = '');
        };

        window.delOrder = async (id) => {
            if(confirm('حذف هذا الطلب؟')) await deleteDoc(doc(db, "orders", id));
        };

        // Tab Switching
        window.switchTab = (id) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.sidebar i').forEach(i => i.classList.remove('active'));
            event.target.classList.add('active');
        };

    </script>
</body>
</html>
